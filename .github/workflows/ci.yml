name: AivoBlock CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Avoid running obsolete revisions of the same pull request in parallel.
# Different pull requests and main use independent concurrency groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Rust formatting
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Verify Rust dependency lockfile
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null

  python:
    name: Python AI engine
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-engine/pyproject.toml
      - name: Install package and tests
        run: python -m pip install -e "./ai-engine[dev]"
      - name: Run tests
        run: python -m pytest ai-engine/tests
      - name: Validate research statistics helpers (stdlib only)
        run: python -m unittest discover -s scripts -p "test_analyze_*.py" -v
      - name: Validate observed benchmark recorder (stdlib only)
        run: python -m unittest discover -s scripts -p "test_record_benchmark.py" -v
      - name: Validate matched service-chain comparison gate (stdlib only)
        run: python -m unittest discover -s scripts -p "test_validate_service_chain.py" -v
      - name: Validate matched evidence assembly (synthetic fixtures)
        run: python -m unittest discover -s scripts -p "test_assemble_service_chain.py" -v
      - name: Validate observed chain finality clock boundaries
        run: python -m unittest discover -s scripts -p "test_chain_finality_timing.py" -v
      - name: Validate repeated finality measurement collector (mocked network)
        run: python -m unittest discover -s scripts -p "test_measure_chain_finality.py" -v
      - name: Validate research evidence provenance manifest
        run: python -m unittest discover -s scripts -p "test_finality_evidence_manifest.py" -v
      - name: Validate descriptive QMLP phase summaries (synthetic fixtures only)
        run: python -m unittest discover -s scripts -p "test_summarize_chain_phases.py" -v
      - name: Validate public evidence archive (synthetic fixtures only)
        run: python -m unittest discover -s scripts -p "test_package_research_evidence.py" -v
      - name: Validate independent archive reanalysis (synthetic fixtures only)
        run: python -m unittest discover -s scripts -p "test_audit_public_evidence.py" -v
      - name: Check research prerelease disclosures and licensing (stdlib only)
        run: |
          python -m unittest discover -s scripts -p "test_check_release_readiness.py" -v
          python scripts/check_release_readiness.py
      - name: Validate workload manifest (stdlib only)
        run: python -m unittest discover -s scripts -p "test_workload_manifest.py" -v

  pytorch_onnx:
    name: PyTorch / ONNX off-chain research
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch, ONNX and ONNX Runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3"
          python -m pip install -e "./ai-engine[dev,research]"
      - name: Off-chain research tests (dataset, quantization, ONNX)
        run: python -m pytest ai-engine/tests/test_offchain_research.py ai-engine/tests/test_qmlp.py -ra
      - name: Train, quantize and export the digits model (machine-readable report)
        run: python -m aivoblock_ai.research --out research-out
      - name: Independent training/dataset seeds (three complete experiments)
        run: |
          for seed in 11 17 23; do
            python -m aivoblock_ai.research \
              --out "research-out/replicates/seed-$seed" \
              --seed "$seed" --training-seed "$seed" > /dev/null
          done
      - uses: dtolnay/rust-toolchain@stable
      - name: Install RocksDB build prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake pkg-config libsnappy-dev
      - name: Rust validator reproduces the PyTorch-quantized model exactly
        working-directory: node
        env:
          AIVOBLOCK_QMLP_FILE: ${{ github.workspace }}/research-out/digits.qmlp.json
        run: cargo test --locked exported_pytorch_qmlp_model_matches_rust -- --nocapture
      - name: Validate trained model as a standalone committed fixture
        run: |
          python -m aivoblock_ai.service_fixture \
            --qmlp-file research-out/digits.qmlp.json \
            --out research-out/service-fixture.json
          python -m aivoblock_ai.service_benchmark \
            --fixture research-out/service-fixture.json \
            --iterations 20 --batch 12 \
            --out research-out/service-trusted.json
          python -m aivoblock_ai.service_benchmark \
            --fixture research-out/service-fixture.json \
            --iterations 20 --batch 12 --verify \
            --out research-out/service-recomputed.json
      - name: Benchmark repeated service-core latency (three fresh processes per mode)
        run: |
          python -m aivoblock_ai.service_replicates \
            --fixture research-out/service-fixture.json \
            --launches 3 --iterations 30 --batch 12 \
            --out research-out/service-replicates.json
      - name: Time Rust inference against the identical trained QMLP fixture
        working-directory: node
        env:
          AIVOBLOCK_SERVICE_FIXTURE: ${{ github.workspace }}/research-out/service-fixture.json
          AIVOBLOCK_RUST_SERVICE_REPORT: ${{ github.workspace }}/research-out/rust-service.json
        run: cargo test --locked exported_qmlp_fixture_rust_timing_when_provided -- --nocapture
      - name: Validate matching Rust and Python service measurements
        run: |
          python -m aivoblock_ai.matched_report \
            --python research-out/service-trusted.json \
            --rust research-out/rust-service.json \
            --out research-out/matched-service-report.json
      - name: Upload research report, ONNX files and QMLP export
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytorch-onnx-research
          path: research-out/
          if-no-files-found: warn

  haskell:
    name: Haskell core
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6.7"
          cabal-version: "3.12"
      - name: Update package index
        run: |
          for attempt in 1 2 3 4; do
            if cabal update; then exit 0; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
      - name: Build
        run: bash ../scripts/ci-cabal-build.sh all
      - name: Test
        run: cabal test all --test-show-details=direct

  rust:
    name: Rust node
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install RocksDB build prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake pkg-config libsnappy-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local Python AI worker
        run: python -m pip install -e "../ai-engine"
      - name: Rust-to-Python partitioned AI integration test
        run: |
          cargo run --locked -- ai-health
          cargo run --locked -- ai-demo
          cargo run --locked -- ai-verify
          cargo run --locked -- ai-partition-demo
          cargo run --locked -- validator-quorum-demo
      - name: Build and test
        run: cargo test --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Check formatting
        run: cargo fmt --all -- --check

  cross_language:
    name: Rust ↔ Haskell IPC integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6.7"
          cabal-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Rust RocksDB prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake pkg-config libsnappy-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local Python worker for cross-language reward diagnostic
        run: python -m pip install -e "./ai-engine"
      - name: Build Haskell IPC executable
        working-directory: core
        run: |
          for attempt in 1 2 3 4; do
            if cabal update; then break; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
          bash ../scripts/ci-cabal-build.sh exe:aivoblock-core
          echo "AIVOBLOCK_HASKELL_EXECUTABLE=$(cabal list-bin exe:aivoblock-core)" >> "$GITHUB_ENV"
      - name: Run Rust ↔ Haskell IPC tests with per-command diagnostics
        working-directory: node
        timeout-minutes: 60
        run: |
          set -euo pipefail
          run_checked() {
            echo "::group::$*"
            echo "Starting $(date -u +%FT%TZ): $*"
            local rc=0
            timeout --signal=TERM --kill-after=10s 300s "$@" || rc=$?
            echo "Finished $(date -u +%FT%TZ): $* (exit $rc)"
            echo "::endgroup::"
            return "$rc"
          }
          # Cold RocksDB compilation can exceed five minutes; compile once outside per-test timeouts.
          echo "::group::Compile Rust test binaries (cold build)"
          cargo test --locked --no-run
          echo "::endgroup::"
          run_checked cargo test --locked haskell_json_ipc_validation_cases -- --nocapture
          run_checked cargo test --locked haskell_rejects_malformed_ipc_frames -- --nocapture
          run_checked cargo test --locked haskell_v3_settlement_agrees_with_rust_mirror -- --nocapture
          run_checked cargo test --locked persistent_core_answers_repeatedly -- --nocapture
          run_checked cargo test --locked testnet:: -- --nocapture --test-threads=1
          run_checked cargo run --locked -- core-health
          run_checked cargo run --locked -- core-validate
          run_checked cargo run --locked -- core-json
          run_checked cargo run --locked -- ai-partition-demo
          run_checked cargo run --locked -- ledger-transition-demo
          run_checked cargo run --locked -- multi-transfer-demo
          run_checked cargo run --locked -- ai-reward-block-demo
          run_checked cargo run --locked -- ai-proof-v2-demo

  testnet_e2e:
    name: Docker private testnet (3 nodes + 4 validators)
    needs: [pytorch_onnx]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build node image (Haskell core, Rust node, Python worker)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.node
          tags: aivoblock-node:testnet
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download trained QMLP model from research CI
        uses: actions/download-artifact@v4
        with:
          name: pytorch-onnx-research
          path: research-out
      - name: Verify research export exists
        run: test -s research-out/digits.qmlp.json
      - name: Collect actual QMLP CPU service baseline (3 launches, 30 executions each)
        env:
          PYTHONPATH: ai-engine/src
        run: |
          mkdir -p testnet/generated/service-baseline
          python3 -m aivoblock_ai.service_fixture \
            --qmlp-file research-out/digits.qmlp.json \
            --out testnet/generated/service-baseline/service-fixture.json
          for launch in 0 1 2; do
            python3 -m aivoblock_ai.service_benchmark \
              --fixture testnet/generated/service-baseline/service-fixture.json \
              --iterations 30 --warmups 2 \
              --launch-id "service-launch-$launch" \
              --observations-out "testnet/generated/service-baseline/launch-$launch.jsonl" \
              --artifacts-dir "testnet/generated/service-baseline/launch-$launch-artifacts" \
              --out "testnet/generated/service-baseline/report-$launch.json"
          done
      - name: Verify actual CPU service observations and consistent QMLP identity
        run: |
          python3 scripts/validate_service_observations.py \
            --directory testnet/generated/service-baseline \
            --out testnet/generated/service-baseline/summary.json
      - name: Verifier, settlement and scaling benchmarks (release build)
        run: |
          mkdir -p testnet/generated
          docker run --rm aivoblock-node:testnet bench --iterations 20 --sweep | tee testnet/generated/bench.json
          cp testnet/generated/bench.json testnet/generated/bench-replicate-1.json
      - name: Repeat verifier benchmarks in independent invocations
        run: |
          for run in 2 3; do
            docker run --rm aivoblock-node:testnet bench --iterations 20 > "testnet/generated/bench-replicate-$run.json"
          done
      - name: Three-node end-to-end demonstration with trained QMLP export
        run: python3 scripts/testnet.py demo --skip-build --qmlp-file research-out/digits.qmlp.json
      - name: Four-validator fault-tolerance scenario
        run: python3 scripts/testnet.py fault --skip-build
      - name: Real 90-task QMLP finality experiment across three independent testnet launches
        run: |
          python3 scripts/measure_chain_finality.py \
            --skip-build --launches 3 --samples 30 --rows 12 \
            --out testnet/generated/pilot-measurements
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("testnet/generated/pilot-measurements")
          files = sorted(root.glob("launch-???.json"))
          assert len(files) == 3, files
          all_requests = set()
          launch_ids = set()
          for file in files:
              rows = json.loads(file.read_text())
              assert len(rows) == 30
              local_heights = set()
              local_blocks = set()
              for row in rows:
                  assert row["launch_id"] not in launch_ids
                  assert row["request_id"] not in all_requests
                  all_requests.add(row["request_id"])
                  local_heights.add(row["finalized_height"])
                  local_blocks.add(row["block_id"])
                  assert row["end_ns"] > row["start_ns"]
                  assert row["elapsed_ms"] > 0
                  assert row["task_id"] and row["block_id"]
                  assert row["workload"] == "qmlp-v1"
              assert len(local_heights) == len(local_blocks) == 30
              launch_ids.add(rows[0]["launch_id"])
              assert {row["launch_id"] for row in rows} == {rows[0]["launch_id"]}
          assert len(launch_ids) == 3 and len(all_requests) == 90
          print("PASS: ninety real finalized QMLP tasks across three fresh testnets")
          PY
      - name: Measure QMLP with shorter finality observation polling
        run: |
          python3 scripts/measure_chain_finality.py \
            --skip-build --launches 3 --samples 30 --rows 12 \
            --polling-interval-s 0.1 \
            --out testnet/generated/fast-poll-measurements
      - name: Compare 1.0s and 0.1s QMLP polling observations
        run: |
          python3 scripts/compare_polling_cadence.py \
            --slow testnet/generated/pilot-measurements \
            --fast testnet/generated/fast-poll-measurements \
            --out testnet/generated/polling-comparison.json
      - name: Observe 90 trained-QMLP chain tasks with the same export as CPU baseline
        run: |
          python3 scripts/measure_chain_finality.py \
            --skip-build --launches 3 --samples 30 --rows 12 \
            --polling-interval-s 0.1 \
            --qmlp-file research-out/digits.qmlp.json \
            --out testnet/generated/trained-qmlp-chain
      - name: Validate trained model and result commitment identity across CPU and chain
        run: |
          python3 scripts/validate_trained_chain_identity.py \
            --chain testnet/generated/trained-qmlp-chain \
            --service testnet/generated/service-baseline/summary.json \
            --out testnet/generated/trained-qmlp-identity.json
      - name: Audit real task-to-finality evidence linkage
        run: |
          python3 scripts/audit_chain_evidence.py \
            --chain testnet/generated/trained-qmlp-chain \
            --out testnet/generated/chain-evidence-audit.json
      - name: Validate and summarize measured QMLP client phases (separate scenarios)
        run: |
          python3 scripts/summarize_chain_phases.py \
            --directory testnet/generated/pilot-measurements \
            --out testnet/generated/phase-summary-1s-seeded.json
          python3 scripts/summarize_chain_phases.py \
            --directory testnet/generated/fast-poll-measurements \
            --out testnet/generated/phase-summary-100ms-seeded.json
          python3 scripts/summarize_chain_phases.py \
            --directory testnet/generated/trained-qmlp-chain \
            --out testnet/generated/phase-summary-100ms-trained.json
      - name: Inspect finalized QMLP commitments
        run: |
          python3 scripts/inspect_finalized_commitments.py --root testnet/generated/trained-qmlp-chain --out testnet/generated/finalized-commitment-presence.json
      - name: Validate and summarize measured research artifacts
        run: |
          python3 scripts/analyze_research_results.py \
            --bench testnet/generated/bench.json \
            --research research-out/report.json \
            --three testnet/generated/three-node/report.json \
            --four testnet/generated/four-validator/report.json \
            --out testnet/generated/research-summary.json
      - name: Validate multi-seed accuracy and benchmark variability
        run: |
          python3 scripts/analyze_replicates.py \
            --models research-out/replicates/seed-11/report.json \
                     research-out/replicates/seed-17/report.json \
                     research-out/replicates/seed-23/report.json \
            --benchmarks testnet/generated/bench-replicate-1.json \
                         testnet/generated/bench-replicate-2.json \
                         testnet/generated/bench-replicate-3.json \
            --out testnet/generated/variability-summary.json
      - name: Compare standalone AI inference with full blockchain verification
        run: |
          python3 scripts/analyze_standalone.py \
            --benchmarks testnet/generated/bench-replicate-1.json \
                         testnet/generated/bench-replicate-2.json \
                         testnet/generated/bench-replicate-3.json \
            --out testnet/generated/standalone-comparison.json
      - name: Record exact QMLP benchmark workload manifest
        run: |
          python3 scripts/workload_manifest.py \
            --benchmarks testnet/generated/bench-replicate-1.json \
                         testnet/generated/bench-replicate-2.json \
                         testnet/generated/bench-replicate-3.json \
            --runner github-actions --revision "$GITHUB_SHA" \
            --out testnet/generated/workload-manifest.json
      - name: Build and checksum public research evidence bundle
        run: |
          python3 scripts/package_research_evidence.py create \
            --root . \
            --out testnet/generated/aivoblock-research-evidence.zip \
            --source-revision "${{ github.event.pull_request.head.sha || github.sha }}" \
            --checkout-revision "$(git rev-parse HEAD)" \
            --run-id "${{ github.run_id }}"
          python3 scripts/package_research_evidence.py verify \
            testnet/generated/aivoblock-research-evidence.zip
      - name: Upload public reproducibility bundle (no private node credentials)
        uses: actions/upload-artifact@v4
        with:
          name: research-evidence-bundle
          path: testnet/generated/aivoblock-research-evidence.zip
          if-no-files-found: error
          retention-days: 90
      - name: Upload testnet reports and node logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testnet-reports
          path: |
            testnet/generated/bench.json
            testnet/generated/research-summary.json
            testnet/generated/bench-replicate-*.json
            testnet/generated/variability-summary.json
            testnet/generated/standalone-comparison.json
            testnet/generated/workload-manifest.json
            testnet/generated/*/report.json
            testnet/generated/*/compose.log
            testnet/generated/pilot-measurements/launch-???.json
            testnet/generated/pilot-measurements/launch-???/three-node/report.json
            testnet/generated/fast-poll-measurements/launch-???.json
            testnet/generated/fast-poll-measurements/launch-???/three-node/report.json
            testnet/generated/polling-comparison.json
            testnet/generated/phase-summary-*.json
            testnet/generated/service-baseline/launch-*.jsonl
            testnet/generated/service-baseline/report-*.json
            testnet/generated/service-baseline/summary.json
            testnet/generated/service-baseline/service-fixture.json
            testnet/generated/trained-qmlp-chain/launch-???.json
            testnet/generated/trained-qmlp-chain/launch-???/three-node/report.json
            testnet/generated/trained-qmlp-identity.json
            testnet/generated/chain-evidence-audit.json
            testnet/generated/finalized-commitment-presence.json
            testnet/generated/trained-qmlp-chain/launch-???/three-node/finalized-block-evidence/*.json
            testnet/generated/service-baseline/launch-*-artifacts/*.json
          if-no-files-found: warn

  manuscript:
    name: Research paper figures against published v0.1.0 data
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit verified prior-work citations and scope boundaries
        run: |
          python3 -m unittest discover -s scripts -p 'test_check_literature_review.py' -v
          python3 scripts/check_literature_review.py
      - name: Download published tagged research archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v0.1.0-research-prototype \
            --repo "$GITHUB_REPOSITORY" \
            --pattern aivoblock-research-evidence.zip \
            --dir manuscript-release
      - name: Verify every paper table against exact release evidence
        run: |
          python3 scripts/package_research_evidence.py verify manuscript-release/aivoblock-research-evidence.zip
          python3 scripts/check_manuscript_evidence.py \
            --archive manuscript-release/aivoblock-research-evidence.zip
      - name: Upload checked research-paper draft
        uses: actions/upload-artifact@v4
        with:
          name: aivoblock-manuscript-draft
          path: research/paper/aivoblock-manuscript.md
          if-no-files-found: error
          retention-days: 90
  preprint:
    name: Review-only preprint PDF/TeX package (no public submission)
    needs: [manuscript]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assert explicit non-submission and author approval gates
        run: |
          python3 -m unittest discover -s scripts -p 'test_preprint_package.py' -v
          python3 scripts/check_preprint_package.py
      - name: Build typeset PDF, LaTeX, sources, and SHA-256 manifest
        run: bash scripts/build_preprint.sh
      - name: Inspect PDF text, page count, and source metadata
        run: |
          python3 -m pip install 'pypdf>=5,<7'
          python3 - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          import json
          base=Path('research/paper/build')
          pdf=base/'aivoblock-preprint.pdf'
          assert pdf.read_bytes().startswith(b'%PDF-'), 'not PDF'
          reader=PdfReader(str(pdf))
          assert 6 <= len(reader.pages) <= 100, 'implausible paper pagination'
          body='\n'.join((p.extract_text() or '') for p in reader.pages)
          for marker in ('AivoBlock','730.760','References','Generative AI assistance'):
              assert marker.lower() in body.lower(), f'PDF missing marker {marker}'
          readiness=json.loads((base/'submission-readiness.json').read_text())
          assert readiness['publicly_submitted'] is False
          assert readiness['approval_count']==0
          print(f'PASS: {len(reader.pages)} readable PDF pages; author approvals pending')
          PY
      - name: Build and independently compile arXiv TeX-only upload candidate
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_package_arxiv_source.py' -v
          python3 scripts/package_arxiv_source.py create \
            --tex research/paper/build/aivoblock-preprint.tex \
            --metadata research/paper/submission-metadata.json \
            --out research/paper/build/arxiv-upload-source.zip
          python3 scripts/package_arxiv_source.py verify research/paper/build/arxiv-upload-source.zip
          mkdir -p research/paper/build/arxiv-check
          unzip -q research/paper/build/arxiv-upload-source.zip -d research/paper/build/arxiv-check
          docker run --rm --user "$(id -u):$(id -g)" \
            --entrypoint xelatex \
            --volume "$PWD/research/paper/build/arxiv-check:/data" \
            --workdir /data pandoc/latex:3.11.0.0-debian \
            -interaction=nonstopmode -halt-on-error main.tex
          if grep -q 'Overfull \\hbox' research/paper/build/arxiv-check/main.log; then
            echo "arXiv preprint PDF contains unwrapped text beyond the page margin"
            grep 'Overfull \\hbox' research/paper/build/arxiv-check/main.log
            exit 1
          fi
          python3 - <<'PY'
          from pypdf import PdfReader
          from pathlib import Path
          pdf=Path('research/paper/build/arxiv-check/main.pdf')
          assert pdf.exists() and pdf.stat().st_size>10000
          pages=PdfReader(str(pdf)).pages
          assert 6<=len(pages)<=100
          content='\n'.join(p.extract_text() or '' for p in pages)
          for text in ('Sayed Jihad ElSayed','AivoBlock','730.760','Generative AI assistance'):
              assert text.lower() in content.lower(), f'missing in compiled arXiv PDF: {text}'
          print(f'PASS: self-contained arXiv source independently compiled {len(pages)} pages')
          PY
      - name: Upload offline review-only preprint and arXiv source candidates
        uses: actions/upload-artifact@v4
        with:
          name: aivoblock-preprint-candidate
          path: |
            research/paper/build/aivoblock-preprint.pdf
            research/paper/build/aivoblock-preprint.tex
            research/paper/build/aivoblock-preprint-source.md
            research/paper/build/submission-metadata.json
            research/paper/build/submission-readiness.json
            research/paper/build/SHA256SUMS.txt
            research/paper/build/build-provenance.json
            research/paper/build/arxiv-upload-source.zip
          if-no-files-found: error
          retention-days: 90
  evidence_reanalysis:
    name: Independent research evidence reanalysis (fresh runner)
    needs: [testnet_e2e]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download completed research evidence bundle from the producer job
        uses: actions/download-artifact@v4
        with:
          name: research-evidence-bundle
          path: independent-input
      - name: Independently recompute archived timing and commitment claims
        run: |
          python3 scripts/audit_public_evidence.py \
            --archive independent-input/aivoblock-research-evidence.zip \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-source-head "${{ github.event.pull_request.head.sha || github.sha }}" \
            --expected-checkout-sha "$(git rev-parse HEAD)" \
            --out independent-output/audit.json
      - name: Upload independent descriptive audit (not external replication)
        uses: actions/upload-artifact@v4
        with:
          name: independent-evidence-audit
          path: independent-output/audit.json
          if-no-files-found: error
          retention-days: 90
  release:
    name: Publish evidence-backed prototype prerelease (main only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [format, python, pytorch_onnx, haskell, rust, cross_language, testnet_e2e, evidence_reanalysis, protobuf]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download this-run validated evidence ZIP
        uses: actions/download-artifact@v4
        with:
          name: research-evidence-bundle
          path: release-assets
      - name: Download this-run independent audit report
        uses: actions/download-artifact@v4
        with:
          name: independent-evidence-audit
          path: release-assets
      - name: Verify evidence, external checksum and reserved-rights release claims
        run: |
          set -euo pipefail
          python3 scripts/check_release_readiness.py --out release-assets/release-readiness.json
          python3 scripts/package_research_evidence.py verify \
            release-assets/aivoblock-research-evidence.zip
          python3 scripts/audit_public_evidence.py \
            --archive release-assets/aivoblock-research-evidence.zip \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-source-head "$GITHUB_SHA" \
            --expected-checkout-sha "$GITHUB_SHA" \
            --out release-assets/independent-audit-recomputed.json
          cmp release-assets/independent-audit-recomputed.json release-assets/audit.json
          mv release-assets/audit.json release-assets/independent-audit.json
          (cd release-assets && sha256sum \
            aivoblock-research-evidence.zip independent-audit.json \
            release-readiness.json > SHA256SUMS.txt)
      - name: Publish immutable-source research prototype prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=v0.1.0-research-prototype
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to replace its recorded evidence."
            exit 0
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "AivoBlock v0.1.0 — Research Prototype" \
            --notes-file docs/releases/v0.1.0-research-prototype.md \
            --prerelease \
            --latest=false \
            release-assets/aivoblock-research-evidence.zip \
            release-assets/independent-audit.json \
            release-assets/release-readiness.json \
            release-assets/SHA256SUMS.txt
  protobuf:
    name: Protocol schemas
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Validate schemas
        run: |
          mkdir -p /tmp/aivoblock-proto
          protoc --proto_path=protocol/proto --descriptor_set_out=/tmp/aivoblock-proto/schema.pb --include_imports protocol/proto/*.proto
