name: AivoBlock CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: Rust formatting
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check Rust formatting
        run: cargo fmt --all -- --check

  python:
    name: Python AI engine
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-engine/pyproject.toml
      - name: Install package and tests
        run: python -m pip install -e "./ai-engine[dev]"
      - name: Run tests
        run: python -m pytest ai-engine/tests

  haskell:
    name: Haskell core
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6.7"
          cabal-version: "3.12"
      - name: Update package index
        run: |
          for attempt in 1 2 3 4; do
            if cabal update; then exit 0; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
      - name: Build
        run: cabal build all
      - name: Test
        run: cabal test all --test-show-details=direct

  rust:
    name: Rust node
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install RocksDB build prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake pkg-config libsnappy-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local Python AI worker
        run: python -m pip install -e "../ai-engine"
      - name: Rust-to-Python partitioned AI integration test
        run: |
          cargo run -- ai-health
          cargo run -- ai-demo
          cargo run -- ai-verify
          cargo run -- ai-partition-demo
      - name: Build and test
        run: cargo test --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Check formatting
        run: cargo fmt --all -- --check

  cross_language:
    name: Rust ↔ Haskell IPC integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6.7"
          cabal-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Rust RocksDB prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake pkg-config libsnappy-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local Python worker for cross-language reward diagnostic
        run: python -m pip install -e "./ai-engine"
      - name: Build Haskell IPC executable
        working-directory: core
        run: |
          for attempt in 1 2 3 4; do
            if cabal update; then break; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
          cabal build exe:aivoblock-core
          echo "AIVOBLOCK_HASKELL_EXECUTABLE=$(cabal list-bin exe:aivoblock-core)" >> "$GITHUB_ENV"
      - name: Run Rust ↔ Haskell health, JSON and malformed-frame tests
        working-directory: node
        run: |
          cargo test haskell_json_ipc_validation_cases -- --nocapture
          cargo test haskell_rejects_malformed_ipc_frames -- --nocapture
          cargo run -- core-health
          cargo run -- core-validate
          cargo run -- core-json
          cargo run -- ai-partition-demo
          cargo run -- ledger-transition-demo
          cargo run -- multi-transfer-demo
          cargo run -- ai-reward-block-demo
          cargo run -- ai-proof-v2-demo

  protobuf:
    name: Protocol schemas
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Validate schemas
        run: |
          mkdir -p /tmp/aivoblock-proto
          protoc --proto_path=protocol/proto --descriptor_set_out=/tmp/aivoblock-proto/schema.pb --include_imports protocol/proto/*.proto
