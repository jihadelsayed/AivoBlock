[package]
name = "aivoblock-node"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Decentralized AivoBlock node runtime for AI puzzle blockchain research"
publish = false

[[bin]]
name = "aivoblock-node"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2.2"
x25519-dalek = "2"
hkdf = "0.12"
chacha20poly1305 = "0.10"
rocksdb = { version = "0.22", default-features = false, features = ["snappy"] }

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
