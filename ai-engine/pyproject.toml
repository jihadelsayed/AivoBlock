[build-system]
requires = ["setuptools>=69,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "aivoblock-ai"
version = "0.1.0"
description = "Local AI puzzle worker for the AivoBlock custom blockchain"
readme = { text = "AivoBlock AI engine: deterministic puzzle execution and experimental proof checking.", content-type = "text/plain" }
requires-python = ">=3.11"
license = { text = "License to be determined" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]
# Off-chain only: PyTorch training/quantization and ONNX export. Consensus
# never imports these. Install CPU PyTorch first to avoid CUDA wheels:
#   pip install --index-url https://download.pytorch.org/whl/cpu torch
research = [
    "torch>=2.2,<3",
    "onnx>=1.15,<2",
    "onnxruntime>=1.17,<2",
    "numpy>=1.26,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
